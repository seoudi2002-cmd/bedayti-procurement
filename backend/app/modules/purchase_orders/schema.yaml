# Canonical PO-line fields. Aliases cover common English and Arabic export headers.
date_field: po_date
dayfirst: true
unique_key: [fiscal_year, po_number, line_number]
fiscal_year_field: fiscal_year  # derived from po_date when the file has no such column
fields:
  - {name: fiscal_year, label: Fiscal Year, type: integer,
     aliases: ["FY", "Fiscal Year", "السنة المالية"]}
  - {name: po_number, label: PO Number, type: text, required: true,
     aliases: ["PO No", "PO #", "Purchase Order", "Order Number", "رقم أمر الشراء", "رقم الطلب", "أمر الشراء"]}
  - {name: line_number, label: Line Number, type: integer, default: 1,
     aliases: ["Line", "Line No", "Item No", "رقم البند", "م"]}
  - {name: po_date, label: PO Date, type: date, required: true,
     aliases: ["Date", "Order Date", "Creation Date", "تاريخ أمر الشراء", "التاريخ"]}
  - {name: branch, label: Branch, type: text, required: true, dimension: branch,
     aliases: ["Branch Name", "Site", "Location", "Store", "الفرع", "اسم الفرع", "الموقع"]}
  - {name: supplier, label: Supplier, type: text, required: true, dimension: supplier,
     aliases: ["Vendor", "Vendor Name", "Supplier Name", "المورد", "اسم المورد"]}
  - {name: category, label: Category, type: text, dimension: category,
     aliases: ["Item Category", "Spend Category", "Group", "الفئة", "التصنيف", "المجموعة"]}
  - {name: item_code, label: Item Code, type: text, dimension: item,
     aliases: ["SKU", "Item ID", "Material Code", "كود الصنف", "رقم الصنف"]}
  - {name: item_description, label: Item Description, type: text,
     aliases: ["Description", "Item", "Item Name", "Material", "الصنف", "الوصف", "اسم الصنف", "البيان"]}
  - {name: quantity, label: Quantity, type: number, required: true, min: 0,
     aliases: ["Qty", "Ordered Qty", "Quantity Ordered", "الكمية"]}
  - {name: uom, label: Unit of Measure, type: text,
     aliases: ["UOM", "Unit", "الوحدة"]}
  - {name: unit_price, label: Unit Price, type: number, required: true, min: 0,
     aliases: ["Price", "Rate", "Unit Cost", "سعر الوحدة", "السعر"]}
  - {name: line_amount, label: Line Amount, type: number,
     derive: {op: multiply, of: [quantity, unit_price]},
     aliases: ["Amount", "Total", "Line Total", "Net Amount", "الإجمالي", "القيمة", "المبلغ"]}
  - {name: currency, label: Currency, type: text, default: EGP,
     aliases: ["Curr", "العملة"]}
  - {name: requested_by, label: Requested By, type: text,
     aliases: ["Requester", "Requestor", "Buyer", "مقدم الطلب"]}
  - {name: required_date, label: Required Date, type: date,
     aliases: ["Need By", "Delivery Date Required", "تاريخ الاحتياج"]}
  - {name: received_date, label: Received Date, type: date,
     aliases: ["Receipt Date", "GRN Date", "Delivered On", "تاريخ الاستلام"]}
  - {name: status, label: Status, type: text,
     aliases: ["PO Status", "Order Status", "الحالة"]}
  - {name: requisition_no, label: Requisition Number, type: text,
     aliases: ["Requisition No", "Requisition", "PR No", "Purchase Request", "رقم إشعار الاحتياج", "إشعار الاحتياج"]}
  - {name: requesting_unit, label: Requesting Unit, type: text, dimension: cost_center,
     aliases: ["Requesting Unit", "Department", "Requesting Department", "الجهة الطالبة", "الإدارة"]}
  - {name: approval_date, label: Approval Date, type: date,
     aliases: ["Approval Date", "Approved On", "تاريخ الاعتماد"]}
  - {name: purchase_method, label: Purchase Method, type: text,
     aliases: ["Purchase Method", "Procurement Method", "Method", "طريقة الشراء"]}
  - {name: delivery_days, label: Delivery Days, type: integer, min: 0,
     aliases: ["Delivery Days", "Lead Time Days", "مدة التوريد"]}
  - {name: payment_days, label: Payment Days, type: integer, min: 0,
     aliases: ["Payment Days", "Credit Days", "مدة السداد"]}
  - {name: payment_terms, label: Payment Terms, type: text,
     aliases: ["Payment Terms", "شروط الدفع", "نظام الدفع"]}
  - {name: vat_rate, label: VAT Rate, type: number, min: 0,
     aliases: ["VAT %", "VAT Rate", "Tax Rate", "نسبة الضريبة"]}
  - {name: vat_amount, label: VAT Amount, type: number,
     aliases: ["VAT Amount", "VAT", "Tax Amount", "قيمة الضريبة"]}
