[project]
name = "bedayti-platform"
version = "0.1.0"
description = "Procurement & Administrative Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pyxlsb>=1.0.10",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "opencv-python-headless>=4.9",
  "numpy>=1.26",
  "pillow>=10",
  "matplotlib>=3.8",
  "reportlab>=4.0",
  "arabic-reshaper>=3.0",
  "python-bidi>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["modules/**/*.yaml", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501", "E702"]
